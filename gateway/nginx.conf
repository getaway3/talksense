# API Gateway (минимальная реализация на Nginx; в проекте ЛР3 — Kong).
# Единственная точка входа для сайта и устройств. Internal-эндпоинты наружу не публикуются.

limit_req_zone $binary_remote_addr zone=devices:10m rate=20r/s;

map $http_x_correlation_id $cid {
    default $http_x_correlation_id;
    ""      $request_id;          # нет заголовка — генерируем
}

upstream venue         { server venue-service:8000; }
upstream device        { server device-service:8000; }
upstream recording     { server recording-service:8000; }
upstream transcription { server transcription-service:8000; }
upstream analysis      { server analysis-service:8000; }
upstream report        { server report-service:8000; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 20m;            # максимальный аудиофрагмент

    proxy_set_header Host              $host;
    proxy_set_header X-Correlation-Id  $cid;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header X-Correlation-Id $cid always;

    # internal API — только для сервисов внутри сети
    location /internal/ {
        default_type application/problem+json;
        return 404 '{"type":"https://talksense.local/problems/not-found","title":"Not found","status":404,"detail":"Нет такого маршрута"}';
    }

    # устройства (X-Device-Token проверяет recording/device-service)
    location = /device/v1/heartbeat   { limit_req zone=devices burst=40 nodelay; proxy_pass http://device; }
    location = /device/v1/recordings  { limit_req zone=devices burst=40 nodelay; proxy_pass http://recording; }

    # сайт (в проекте здесь проверка JWT Keycloak плагином шлюза)
    location /api/v1/venues      { proxy_pass http://venue; }
    location /api/v1/devices     { proxy_pass http://device; }
    location /api/v1/recordings  { proxy_pass http://recording; }
    location /api/v1/transcripts { proxy_pass http://transcription; }
    location /api/v1/incidents   { proxy_pass http://analysis; }
    location /api/v1/reports     { proxy_pass http://report; }

    location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }

    location / {
        default_type application/problem+json;
        return 404 '{"type":"https://talksense.local/problems/not-found","title":"Not found","status":404,"detail":"Нет такого маршрута"}';
    }
}
