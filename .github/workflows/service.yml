# Переиспользуемый пайплайн одного сервиса: build → test → package (→ publish).
# Вызывается из ci.yml матрицей по сервисам.
name: service-pipeline

on:
  workflow_call:
    inputs:
      service:        # имя каталога: venue-service, ..., или mock:speechkit
        required: true
        type: string
      publish:        # публиковать образ в GHCR (только push в main)
        required: true
        type: boolean
    outputs:
      image:
        description: Опубликованный образ (ghcr.io/<owner>/talksense-<name>:<sha>)
        value: ${{ jobs.package.outputs.image }}

permissions:
  contents: read

jobs:
  test:
    name: build & test
    if: ${{ !startsWith(inputs.service, 'mock:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                  # кэш зависимостей pip
          cache-dependency-path: services/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check services/common services/${{ inputs.service }}

      - name: Byte-compile (сборка)
        run: python -m compileall -q services/common services/${{ inputs.service }}

      - name: Unit tests
        working-directory: services/${{ inputs.service }}
        run: pytest -q --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.service }}
          path: services/${{ inputs.service }}/junit.xml

  package:
    name: docker image
    needs: test
    # для моков нет тестов — job test пропускается, это не должно блокировать сборку
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                                 # для push в GHCR через GITHUB_TOKEN
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build context
        id: meta
        shell: bash
        run: |
          svc="${{ inputs.service }}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$svc" == mock:* ]]; then
            name="${svc#mock:}-mock"
            { echo "context=mocks"; echo "dockerfile=mocks/Dockerfile"; echo "build_args=MOCK=${svc#mock:}"; } >> "$GITHUB_OUTPUT"
          else
            name="$svc"
            { echo "context=services"; echo "dockerfile=services/$svc/Dockerfile"; echo "build_args="; } >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/talksense-$name:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$owner/talksense-$name:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}       # токен выдаёт GitHub на время прогона, в репозитории его нет

      - name: Build${{ inputs.publish && ' & push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: ${{ steps.meta.outputs.build_args }}
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.name }}   # кэш слоёв Docker
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.name }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:                                          # после push образ сканируется прямо из GHCR
          TRIVY_USERNAME: ${{ inputs.publish && github.actor || '' }}
          TRIVY_PASSWORD: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"                              # отчёт информационный, сборку не блокирует
