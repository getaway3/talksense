# CI/CD TalkSense (ЛР5)
#   PR в main      → проверки, тесты, сборка образов (без публикации)
#   push в main    → то же + публикация образов в GHCR + деплой на staging (Docker Compose на раннере) + smoke-тест
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contracts:
    name: lint OpenAPI / AsyncAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Redocly lint
        run: npx --yes @redocly/cli@2 lint api/*-service.yaml
      - name: AsyncAPI validate
        run: npx --yes @asyncapi/cli@6 validate api/asyncapi.yaml

  services:
    name: ${{ matrix.service }}
    needs: api-contracts
    strategy:
      fail-fast: false
      matrix:
        service:
          - venue-service
          - device-service
          - recording-service
          - transcription-service
          - analysis-service
          - report-service
          - mock:speechkit
          - mock:gigachat
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  integration:
    name: integration tests (saga)
    needs: api-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/requirements-dev.txt
      - run: pip install -r services/requirements-dev.txt
      - name: Common library tests
        run: pytest -q services/common/tests
      - name: End-to-end saga tests (6 services, in-memory broker)
        run: pytest -q tests --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml

  deploy-staging:
    name: deploy to staging + smoke test
    needs: [services, integration]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:8080
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack from published images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/talksense
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_TOKEN: ${{ secrets.STAGING_SERVICE_TOKEN || 'ci-service-token' }}
        run: |
          export IMAGE_PREFIX="${IMAGE_PREFIX,,}" IMAGE_TAG="${IMAGE_TAG::7}"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-build --wait --wait-timeout 180
          docker compose ps

      - name: Smoke test (demo scenarios through gateway)
        run: |
          pip install httpx
          python demo/run_demo.py --gateway http://localhost:8080 --speechkit http://localhost:8091

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml down -v
